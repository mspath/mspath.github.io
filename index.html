<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title></title>
<style>
  :root{
    --bg:#EDEBE6; --dot:#8A7A5C; --line: 138,122,92;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141311; --dot:#C9B98C; --line: 201,185,140; }
  }
  html, body{ height:100%; margin:0; overflow:hidden; }
  body{ background:var(--bg); }
  canvas{ display:block; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, points;

  function color(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }

  function seed(){
    var area = W * H;
    var count = Math.max(24, Math.min(70, Math.round(area / 26000)));
    points = [];
    for (var i = 0; i < count; i++){
      points.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.12,
        vy: (Math.random() - 0.5) * 0.12,
        r: 1 + Math.random() * 1.6
      });
    }
  }

  function step(){
    for (var i = 0; i < points.length; i++){
      var p = points[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    var lineRGB = color('--line');
    var dotColor = color('--dot');
    var linkDist = Math.min(180, Math.max(W, H) * 0.14);

    for (var i = 0; i < points.length; i++){
      for (var j = i + 1; j < points.length; j++){
        var a = points[i], b = points[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < linkDist){
          var alpha = (1 - dist / linkDist) * 0.35;
          ctx.strokeStyle = 'rgba(' + lineRGB + ',' + alpha + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    ctx.fillStyle = dotColor;
    for (var k = 0; k < points.length; k++){
      var p = points[k];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop(){
    step();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
  if (!reduceMotion) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
